site_name: UP PCS Study Library
site_description: Readable UPSC and UP PCS notes, organised subject-wise and by Mains PYQ themes.
site_author: UP PCS Study Library
site_url: https://nitishpratap.github.io/UP-PCS/

theme:
  name: material
  language: en
  font: false
  # Study fonts (Lexend + Atkinson Hyperlegible) are loaded in extra.css.
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

repo_name: UP-PCS
repo_url: https://github.com/nitishpratap/UP-PCS
edit_uri: ""

docs_dir: docs
use_directory_urls: true

exclude_docs: |
  subjects/prompt.md
  subjects/**/_*/**
  subjects/**/_*.md
  mains-pyqs/_*.md
  mains-pyqs/_*/**
  mains-pyqs/prompt.md
  mains-pyqs/TOPIC_INPUT.md
  mains-pyqs/README.md
  active-recall/prompt.md
  active-recall/_*.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nitishpratap/UP-PCS
      name: View source on GitHub

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/reading-mode.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - abbr
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3

plugins:
  - search
  - awesome-pages
